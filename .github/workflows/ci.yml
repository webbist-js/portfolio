name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace frontend
      - run: npm run check --workspace frontend
      - run: npm run check --workspace backend
      - run: npm run test:unit --workspace frontend -- --run
      - run: npm run build --workspace frontend
      - run: npm run build --workspace backend

  e2e:
    name: E2E + accessibility (axe)
    runs-on: ubuntu-latest
    env:
      # Throwaway secrets for the ephemeral CI database.
      APP_KEYS: ci-key-1,ci-key-2
      API_TOKEN_SALT: ci-salt
      ADMIN_JWT_SECRET: ci-admin-secret
      JWT_SECRET: ci-jwt-secret
      TRANSFER_TOKEN_SALT: ci-transfer-salt
      ENCRYPTION_KEY: ci-encryption-key0000000000000000
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and seed backend
        run: |
          npm run build --workspace backend
          npm run seed --workspace backend
      - name: Start backend
        run: |
          npm run start --workspace backend &
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:1337/_health; then exit 0; fi
            sleep 2
          done
          echo "Backend failed to become healthy" && exit 1
      - name: Run e2e suite
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
